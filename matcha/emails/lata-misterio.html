<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0b140c}
.s{position:relative;width:1100px;height:820px;overflow:hidden;border-radius:0;
  background:radial-gradient(48% 46% at 50% 54%,#3f6a1c 0%,#1d3a17 32%,#0e1d10 62%,#070d08 100%)}
/* halo lima detrás */
.halo{position:absolute;left:50%;top:52%;width:640px;height:640px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(201,220,92,.55),rgba(201,220,92,.12) 55%,rgba(201,220,92,0) 75%);filter:blur(6px)}
/* lata en silueta */
.tin{position:absolute;left:50%;top:50%;width:360px;height:400px;transform:translate(-50%,-44%)}
.tin>div{position:absolute;left:0;right:0}
.body{top:16%;bottom:6%;background:linear-gradient(90deg,#050906 0%,#0b130c 40%,#0d170e 60%,#040805 100%);
  border-radius:0 0 50% 50%/0 0 9% 9%;box-shadow:inset 3px 0 0 rgba(201,220,92,.55),inset -3px 0 0 rgba(201,220,92,.35)}
.lid{top:5%;height:30%;background:linear-gradient(90deg,#060a07,#101a11 45%,#050906);border-radius:0 0 50% 50%/0 0 18% 18%;
  box-shadow:inset 3px 0 0 rgba(201,220,92,.6),inset -3px 0 0 rgba(201,220,92,.4),0 3px 0 rgba(0,0,0,.6)}
.top{top:0;height:12%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#1a2a17,#070c08 70%);
  box-shadow:0 -2px 0 rgba(214,232,120,.85),0 -10px 26px rgba(201,220,92,.45)}
/* destello de luz sobre el borde */
.glint{top:1%;height:4%;left:30%;right:30%;border-radius:50%;background:radial-gradient(closest-side,rgba(240,250,190,.9),rgba(240,250,190,0));filter:blur(3px)}
.shadow{top:92%;height:12%;left:-20%;right:-20%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),rgba(0,0,0,0))}
/* polvo de matcha flotando */
.dust{position:absolute;inset:0}
.dust i{position:absolute;border-radius:50%;background:rgba(201,220,92,.7)}
/* interrogante discreto en la etiqueta */
.q{position:absolute;left:0;right:0;top:52%;text-align:center;font:200 64px/1 'Jost',sans-serif;color:rgba(201,220,92,.22);letter-spacing:.1em}
</style></head><body><div class="s">
<div class="halo"></div>
<div class="dust" id="d"></div>
<div class="tin"><div class="shadow"></div><div class="body"></div><div class="lid"></div><div class="top"></div><div class="glint"></div><div class="q">?</div></div>
</div><script>
const d=document.getElementById('d');let r=7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
for(let i=0;i<70;i++){const e=document.createElement('i');const s=1+rnd()*3.2;e.style.cssText=`left:${10+rnd()*80}%;top:${8+rnd()*84}%;width:${s}px;height:${s}px;opacity:${.15+rnd()*.6};filter:blur(${rnd()<.3?1.5:0}px)`;d.append(e)}
</script></body></html>
